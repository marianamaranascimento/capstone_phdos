  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

\u002Fdiv>\n    <div style=\"border-top:2px solid #17291d;background:#eef2e6;\">\n      <div style=\"max-width:1080px;margin:0 auto;display:flex;flex-wrap:wrap;gap:5px;padding:7px 18px;font-family:'Pixelify Sans',sans-serif;font-size:15px;\">\n        <sc-for list=\"{{ tabs }}\" as=\"t\" hint-placeholder-count=\"6\">\n          <span sc-camel-on-click=\"{{ t.onClick }}\" style=\"cursor:pointer;white-space:nowrap;border:1.5px solid #17291d;padding:2px 8px;background:{{ t.bg }};color:{{ t.fg }};display:flex;gap:5px;align-items:baseline;\"><span style=\"font-family:'Hanken Grotesk',sans-serif;font-weight:700;\">{{ t.num }}<\u002Fspan><span>{{ t.name }}<\u002Fspan><\u002Fspan>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <div style=\"max-width:1080px;margin:0 auto;padding:28px 18px 40px;display:flex;flex-direction:column;gap:22px;\">\n\n    <sc-if value=\"{{ t0 }}\" hint-placeholder-val=\"{{ true }}\">\n      <div data-screen-label=\"01 Problem\" style=\"display:flex;flex-direction:column;gap:4px;\">\n        <div style=\"font-family:'Pixelify Sans',sans-serif;font-size:15px;color:#a8221a;\"><span style=\"font-family:'Hanken Grotesk',sans-serif;font-weight:700;\">01<\u002Fspan> Problem<\u002Fdiv>\n        <h2 style=\"margin:0;font-size:32px;font-weight:800;letter-spacing:-.02em;line-height:1.1;\">A PhD is a multi-year project without a dedicated manager<\u002Fh2>\n      <\u002Fdiv>\n\n      <div data-win=\"1\" style=\"position:relative;background:#fdfcf8;border:2px solid #17291d;box-shadow:5px 5px 0 #17291d;min-width:0;\">\n        <div data-handle=\"1\" style=\"display:flex;align-items:center;gap:10px;border-bottom:2px solid #17291d;padding:5px 10px;background:repeating-linear-gradient(0deg,#fdfcf8 0 2px,#e34d43 2px 4px);cursor:grab;user-select:none;touch-action:none;\">\n          <span data-minbtn=\"1\" style=\"width:12px;height:12px;border:2px solid #17291d;background:#fdfcf8;cursor:pointer;flex:none;\"><\u002Fspan>\n          <span style=\"margin:0 auto;background:#fdfcf8;padding:0 10px;font-family:'Pixelify Sans',sans-serif;font-size:15px;font-weight:600;color:#17291d;\">about_phdOS.txt<\u002Fspan>\n        <\u002Fdiv>\n        <div data-body=\"1\" style=\"padding:24px 26px 26px;display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,320px),1fr));gap:24px 30px;align-items:center;\">\n          <div style=\"min-width:0;display:flex;flex-direction:column;gap:14px;\">\n            <div style=\"font-family:'Pixelify Sans',sans-serif;font-size:15px;color:#a8221a;\">PM course · capstone project · status as of <span style=\"font-family:'Hanken Grotesk',sans-serif;font-weight:700;\">25 Oct 2026<\u002Fspan><\u002Fdiv>\n            <h1 style=\"margin:0;font-size:44px;font-weight:800;line-height:1.02;letter-spacing:-.03em;text-wrap:balance;\">phd.OS: Finishing a PhD <span style=\"background:linear-gradient(transparent 58%,#f3d687 58%);\">Like a Project<\u002Fspan><\u002Fh1>\n            <p style=\"margin:0;font-size:16.5px;line-height:1.6;text-wrap:pretty;\">phd.OS is <mark style=\"background:linear-gradient(transparent 55%,#f3d687 55%);color:inherit;padding:0 1px;\">a project management system I built in Notion<\u002Fmark> to run the final stretch of my PhD in Biomedical Sciences.<\u002Fp>\n            <p style=\"margin:0;font-size:16.5px;line-height:1.6;text-wrap:pretty;\">The project management course taught me the theory: scoping, work breakdown, risk management, sprint planning and goal setting. <mark style=\"background:linear-gradient(transparent 55%,#f3d687 55%);color:inherit;padding:0 1px;\">The capstone was where I applied it to my own professional reality.<\u002Fmark><\u002Fp>\n          <\u002Fdiv>\n          <div style=\"min-width:0;\">\n            <div style=\"font-family:'Pixelify Sans',sans-serif;font-size:13px;color:#4a5a4d;margin-bottom:8px;\">the moving parts · click to see the build<\u002Fdiv>\n            <div style=\"display:grid;grid-template-columns:1fr 1fr;gap:8px;\">\n              <div sc-camel-on-click=\"{{ goBuild }}\" style=\"cursor:pointer;background:#e34d43;color:#fdfcf8;border:2px solid #17291d;padding:12px 12px 10px;display:flex;flex-direction:column;gap:3px;transition:transform .15s;\" style-hover=\"transform:translate(-2px,-2px);\">\n                <div style=\"font-size:22px;font-weight:800;line-height:1;\">Pub1<\u002Fdiv>\n                <div style=\"font-size:12.5px;\">publication<\u002Fdiv>\n                <div style=\"font-family:'Pixelify Sans',sans-serif;font-size:12.5px;margin-top:6px;\">in progress<\u002Fdiv>\n              <\u002Fdiv>\n              <div sc-camel-on-click=\"{{ goBuild }}\" style=\"cursor:pointer;background:#ce9d30;color:#17291d;border:2px solid #17291d;padding:12px 12px 10px;display:flex;flex-direction:column;gap:3px;transition:transform .15s;\" style-hover=\"transform:translate(-2px,-2px);\">\n                <div style=\"font-size:22px;font-weight:800;line-height:1;\">Pub2<\u002Fdiv>\n                <div style=\"font-size:12.5px;\">publication<\u002Fdiv>\n                <div style=\"font-family:'Pixelify Sans',sans-serif;font-size:12.5px;margin-top:6px;\">fully done<\u002Fdiv>\n              <\u002Fdiv>\n              <div sc-camel-on-click=\"{{ goBuild }}\" style=\"cursor:pointer;background:#2e3e33;color:#fdfcf8;border:2px solid #17291d;padding:12px 12px 10px;display:flex;flex-direction:column;gap:3px;transition:transform .15s;\" style-hover=\"transform:translate(-2px,-2px);\">\n                <div style=\"font-size:22px;font-weight:800;line-height:1;\">Thesis<\u002Fdiv>\n                <div style=\"font-size:12.5px;\">manuscript<\u002Fdiv>\n                <div style=\"font-family:'Pixelify Sans',sans-serif;font-size:12.5px;margin-top:6px;\">mostly ahead<\u002Fdiv>\n              <\u002Fdiv>\n              <div sc-camel-on-click=\"{{ goBuild }}\" style=\"cursor:pointer;background:#f3d687;color:#17291d;border:2px solid #17291d;padding:12px 12px 10px;display:flex;flex-direction:column;gap:3px;transition:transform .15s;\" style-hover=\"transform:translate(-2px,-2px);\">\n                <div style=\"font-size:22px;font-weight:800;line-height:1;\">Admin<\u002Fdiv>\n                <div style=\"font-size:12.5px;\">requirements<\u002Fdiv>\n                <div style=\"font-family:'Pixelify Sans',sans-serif;font-size:12.5px;margin-top:6px;\">mostly ahead<\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <div data-win=\"1\" style=\"position:relative;background:#fdfcf8;border:2px solid #17291d;box-shadow:5px 5px 0 #17291d;min-width:0;\">\n        <div data-handle=\"1\" style=\"display:flex;align-items:center;gap:10px;border-bottom:2px solid #17291d;padding:5px 10px;background:#f3d687;cursor:grab;user-select:none;touch-action:none;\">\n          <span data-minbtn=\"1\" style=\"width:12px;height:12px;border:2px solid #17291d;background:#fdfcf8;cursor:pointer;flex:none;\"><\u002Fspan>\n          <span style=\"font-family:'Pixelify Sans',sans-serif;font-size:15px;font-weight:600;color:#17291d;\">why_it_exists.txt<\u002Fspan>\n        <\u002Fdiv>\n        <div data-body=\"1\" style=\"padding:18px 22px 22px;display:flex;flex-direction:column;gap:14px;\">\n          <div style=\"display:flex;flex-wrap:wrap;gap:8px;\">\n            <span style=\"background:#fdfcf8;color:#17291d;border:1.5px solid #17291d;padding:4px 10px;font-weight:600;font-size:13.5px;white-space:nowrap;\">unclear remaining scope<\u002Fspan>\n            <span style=\"background:#fdfcf8;color:#17291d;border:1.5px solid #17291d;padding:4px 10px;font-weight:600;font-size:13.5px;white-space:nowrap;\">timelines that move<\u002Fspan>\n            <span style=\"background:#fdfcf8;color:#17291d;border:1.5px solid #17291d;padding:4px 10px;font-weight:600;font-size:13.5px;white-space:nowrap;\">no PM training<\u002Fspan>\n            <span style=\"background:#fdfcf8;color:#17291d;border:1.5px solid #17291d;padding:4px 10px;font-weight:600;font-size:13.5px;white-space:nowrap;\">work runs in parallel<\u002Fspan>\n          <\u002Fdiv>\n          <p style=\"margin:0;font-size:15.5px;line-height:1.6;max-width:820px;text-wrap:pretty;\">PhD students in the biomedical sciences run <mark style=\"background:linear-gradient(transparent 55%,#f3d687 55%);color:inherit;padding:0 1px;\">projects of four to six years, often several at once,<\u002Fmark> yet are rarely taught project management. We learn it by trial and error. By my final stretch I had to juggle two publications, the thesis manuscript and the university paperwork, and I could not navigate what was left.<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <div data-win=\"1\" style=\"position:relative;background:#fdfcf8;border:2px solid #17291d;box-shadow:5px 5px 0 #17291d;min-width:0;\">\n        <div data-handle=\"1\" style=\"display:flex;align-items:center;gap:10px;border-bottom:2px solid #17291d;padding:5px 10px;background:repeating-linear-gradient(0deg,#fdfcf8 0 2px,#e03a2f 2px 4px);cursor:grab;user-select:none;touch-action:none;\">\n          <span data-minbtn=\"1\" style=\"width:12px;height:12px;border:2px solid #17291d;background:#fdfcf8;cursor:pointer;flex:none;\"><\u002Fspan>\n          <span style=\"margin:0 auto;background:#fdfcf8;padding:0 10px;font-family:'Pixelify Sans',sans-serif;font-size:15px;font-weight:600;\">the_first_attempt.img<\u002Fspan>\n        <\u002Fdiv>\n        <div data-body=\"1\" style=\"padding:18px 20px 20px;display:flex;flex-direction:column;gap:14px;\">\n          <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:16px;align-items:stretch;\">\n            <div style=\"display:flex;flex-direction:column;gap:8px;min-width:0;\">\n              <div style=\"font-family:'Pixelify Sans',sans-serif;font-size:13px;color:#a8221a;\"><span style=\"font-family:'Hanken Grotesk',sans-serif;font-weight:700;\">2023/24<\u002Fspan> · mindmap<\u002Fdiv>\n              <div style=\"flex:1;border:2px solid #17291d;background:#ffffff;display:flex;align-items:center;justify-content:center;overflow:hidden;\">\n                <img src=\"5f7c04bc-fa0b-401a-bb16-b7866209ef68\" alt=\"The 2023/24 PhD planning mindmap, blurred so the content cannot be read. Eight coloured branches spread out from a central node.\" style=\"display:block;width:100%;height:auto;\">\n              <\u002Fdiv>\n            <\u002Fdiv>\n            <div style=\"display:flex;flex-direction:column;gap:8px;min-width:0;\">\n              <div style=\"font-family:'Pixelify Sans',sans-serif;font-size:13px;color:#a8221a;\"><span style=\"font-family:'Hanken Grotesk',sans-serif;font-weight:700;\">2026<\u002Fspan> · what the dashboard opens on<\u002Fdiv>\n              <div style=\"flex:1;border:2px solid #17291d;background:#eef2e6;display:flex;flex-direction:column;\">\n                <div style=\"background:#e03a2f;color:#fdfcf8;border-bottom:2px solid #17291d;padding:6px 12px;font-family:'Pixelify Sans',sans-serif;font-size:14px;\">Now<\u002Fdiv>\n                <div style=\"padding:12px;display:flex;flex-direction:column;gap:8px;\">\n                  <sc-for list=\"{{ nowItems }}\" as=\"it\" hint-placeholder-count=\"4\">\n                    <div style=\"background:#fdfcf8;border:1.5px solid #17291d;padding:8px 10px;display:flex;gap:10px;align-items:baseline;font-size:14.5px;\"><span style=\"font-family:'Pixelify Sans',sans-serif;font-size:12px;background:#f2d27a;border:1.5px solid #17291d;padding:0 6px;white-space:nowrap;\">{{ it.sec }}<\u002Fspan><span style=\"font-weight:600;\">{{ it.name }}<\u002Fspan><\u002Fdiv>\n                  <\u002Fsc-for>\n                <\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <p style=\"margin:0;padding-top:12px;border-top:1.5px dashed #9fab98;font-size:15px;line-height:1.6;max-width:820px;text-wrap:pretty;\"><strong>Two perspectives on the same project.<\u002Fstrong> I made the mindmap after a short project management workshop. It was so overwhelming that I never opened it again.<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <div style=\"display:flex;flex-wrap:wrap;gap:14px;align-items:center;\">\n        <div style=\"flex:1 1 420px;font-family:'Pixelify Sans',sans-serif;font-size:19px;line-height:1.45;background:#2e3e33;color:#fdfcf8;padding:16px 18px;border:2px solid #17291d;box-shadow:5px 5px 0 #17291d;\"><span style=\"color:#f3d687;\">&gt;<\u002Fspan> If I had known project management when I started, how would I have run my PhD?<span style=\"background:#e34d43;\">&nbsp;<\u002Fspan><\u002Fdiv>\n        <span sc-camel-on-click=\"{{ next }}\" style=\"cursor:pointer;font-family:'Pixelify Sans',sans-serif;font-size:14px;border:2px solid #17291d;padding:3px 10px;background:#fdfcf8;box-shadow:3px 3px 0 #17291d;\" style-hover=\"background:#f3d687;\">02 Scope ▸<\u002Fspan>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n\n    <sc-if value=\"{{ t1 }}\" hint-placeholder-val=\"{{ false }}\">\n      <div data-screen-label=\"02 Scope\" style=\"display:flex;flex-direction:column;gap:4px;\">\n        <div style=\"font-family:'Pixelify Sans',sans-serif;font-size:15px;color:#a8221a;\"><span style=\"font-family:'Hanken Grotesk',sans-serif;font-weight:700;\">02<\u002Fspan> Scope<\u002Fdiv>\n        <h2 style=\"margin:0;font-size:32px;font-weight:800;letter-spacing:-.02em;line-height:1.1;\">I ran the capstone as a project before I built anything<\u002Fh2>\n      <\u002Fdiv>\n      <p style=\"margin:0;font-size:16.5px;line-height:1.6;max-width:820px;font-weight:600;text-wrap:pretty;\">I managed the capstone in its own Notion space, separate from the dashboard. The dashboard holds thesis work only.<\u002Fp>\n\n      <div data-win=\"1\" style=\"position:relative;background:#fdfcf8;border:2px solid #17291d;box-shadow:5px 5px 0 #17291d;min-width:0;\">\n        <div data-handle=\"1\" style=\"display:flex;align-items:center;gap:10px;border-bottom:2px solid #17291d;padding:5px 10px;background:repeating-linear-gradient(0deg,#fdfcf8 0 2px,#e03a2f 2px 4px);cursor:grab;user-select:none;touch-action:none;\">\n          <span data-minbtn=\"1\" style=\"width:12px;height:12px;border:2px solid #17291d;background:#fdfcf8;cursor:pointer;flex:none;\"><\u002Fspan>\n          <span style=\"margin:0 auto;background:#fdfcf8;padding:0 10px;font-family:'Pixelify Sans',sans-serif;font-size:15px;font-weight:600;\">charter.txt<\u002Fspan>\n        <\u002Fdiv>\n        <div data-body=\"1\" style=\"padding:20px 22px 22px;display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:16px 28px;font-size:15.5px;line-height:1.65;\">\n          <div style=\"display:flex;flex-direction:column;gap:12px;\">\n            <p style=\"margin:0;text-wrap:pretty;\">I applied the course to the build itself, not only to its contents. <mark style=\"background:linear-gradient(transparent 55%,#f3d687 55%);color:inherit;padding:0 1px;\">Before I built anything, I wrote a project charter<\u002Fmark> with the purpose, scope and success criteria.<\u002Fp>\n            <p style=\"margin:0;text-wrap:pretty;\">I then broke the capstone into its own work breakdown structure, with deliverables, work packages and milestones. I kept a separate risk register for risks to the capstone rather than to the thesis.<\u002Fp>\n          <\u002Fdiv>\n          <div style=\"display:flex;flex-direction:column;gap:8px;\">\n            <div style=\"border:2px solid #17291d;padding:10px 12px;background:#eef2e6;display:flex;justify-content:space-between;gap:10px;align-items:baseline;\"><span style=\"font-weight:700;\">Time<\u002Fspan><span style=\"font-size:14.5px;text-align:right;\">three dedicated weeks, one per module<\u002Fspan><\u002Fdiv>\n            <div style=\"border:2px solid #17291d;padding:10px 12px;background:#eef2e6;display:flex;justify-content:space-between;gap:10px;align-items:baseline;\"><span style=\"font-weight:700;\">Rule<\u002Fspan><span style=\"font-size:14.5px;text-align:right;\">no time taken from the thesis<\u002Fspan><\u002Fdiv>\n            <div style=\"border:2px solid #17291d;padding:10px 12px;background:#eef2e6;display:flex;justify-content:space-between;gap:10px;align-items:baseline;\"><span style=\"font-weight:700;\">Scope<\u002Fspan><span style=\"font-size:14.5px;text-align:right;\">four core pieces, one stretch goal<\u002Fspan><\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,320px),1fr));gap:22px;align-items:start;\">\n        <div data-win=\"1\" style=\"position:relative;background:#fdfcf8;border:2px solid #17291d;box-shadow:5px 5px 0 #17291d;min-width:0;\">\n          <div data-handle=\"1\" style=\"display:flex;align-items:center;gap:10px;border-bottom:2px solid #17291d;padding:5px 10px;background:#c9921a;cursor:grab;user-select:none;touch-action:none;\">\n            <span data-minbtn=\"1\" style=\"width:12px;height:12px;border:2px solid #17291d;background:#fdfcf8;cursor:pointer;flex:none;\"><\u002Fspan>\n            <span style=\"font-family:'Pixelify Sans',sans-serif;font-size:15px;font-weight:600;\">In scope<\u002Fspan>\n          <\u002Fdiv>\n          <div data-body=\"1\" style=\"padding:18px 22px 20px;font-size:15.5px;line-height:1.6;\">\n            <ul>\n              <li>Thesis work breakdown structure, risk register, progress view and task tracker in Notion<\u002Fli>\n              <li>Using the dashboard through the end of the course<\u002Fli>\n              <li>Final report and presentation, including a reflection on limitations<\u002Fli>\n            <\u002Ful>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div data-win=\"1\" style=\"position:relative;background:#fdfcf8;border:2px solid #17291d;box-shadow:5px 5px 0 #17291d;min-width:0;\">\n          <div data-handle=\"1\" style=\"display:flex;align-items:center;gap:10px;border-bottom:2px solid #17291d;padding:5px 10px;background:#eef2e6;cursor:grab;user-select:none;touch-action:none;\">\n            <span data-minbtn=\"1\" style=\"width:12px;height:12px;border:2px solid #17291d;background:#fdfcf8;cursor:pointer;flex:none;\"><\u002Fspan>\n            <span style=\"font-family:'Pixelify Sans',sans-serif;font-size:15px;font-weight:600;\">Out of scope<\u002Fspan>\n          <\u002Fdiv>\n          <div data-body=\"1\" style=\"padding:18px 22px 20px;font-size:15.5px;line-height:1.6;color:#33463a;\">\n            <ul>\n              <li>Blank template for other students (stretch goal, left Not started by decision)<\u002Fli>\n              <li>Retrospective analysis of past PhD delays, dropped from the original concept<\u002Fli>\n              <li>Testing a template with another PhD student<\u002Fli>\n              <li>A system built or validated to work across labs, fields or institutions<\u002Fli>\n            <\u002Ful>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <div style=\"background:#ce9d30;color:#17291d;border:2px solid #17291d;box-shadow:5px 5px 0 #17291d;min-width:0;\">\n        <div style=\"display:flex;align-items:center;gap:10px;border-bottom:2px solid #17291d;padding:5px 10px;background:#f3d687;\">\n          <span style=\"width:12px;height:12px;border:2px solid #17291d;background:#fdfcf8;flex:none;\"><\u002Fspan>\n          <span style=\"font-family:'Pixelify Sans',sans-serif;font-size:15px;font-weight:600;\">scope_decision.card<\u002Fspan>\n        <\u002Fdiv>\n        <div style=\"padding:18px 22px 20px;display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,240px),1fr));gap:16px 26px;font-size:15px;line-height:1.55;\">\n          <div style=\"display:flex;flex-direction:column;gap:6px;\"><div style=\"font-family:'Pixelify Sans',sans-serif;font-size:13px;\">Decision<\u002Fdiv><div style=\"font-size:20px;font-weight:800;line-height:1.2;\">I left the template for other students unbuilt.<\u002Fdiv><\u002Fdiv>\n          <div style=\"display:flex;flex-direction:column;gap:6px;\"><div style=\"font-family:'Pixelify Sans',sans-serif;font-size:13px;\">Why<\u002Fdiv><div>My capstone register rated time competition with the thesis High likelihood and High impact. The template was the only deliverable I could drop without losing a core piece.<\u002Fdiv><\u002Fdiv>\n          <div style=\"display:flex;flex-direction:column;gap:6px;\"><div style=\"font-family:'Pixelify Sans',sans-serif;font-size:13px;\">Result<\u002Fdiv><div><span style=\"font-family:'Pixelify Sans',sans-serif;font-size:12.5px;padding:1px 7px;border:1.5px solid #17291d;background:#fdfcf8;white-space:nowrap;\">Not started, by decision<\u002Fspan><\u002Fdiv><div>Both time-related capstone risks are Closed. I could say no with a reason rather than a feeling.<\u002Fdiv><\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <div data-win=\"1\" style=\"position:relative;background:#fdfcf8;border:2px solid #17291d;box-shadow:5px 5px 0 #17291d;min-width:0;\">\n        <div data-handle=\"1\" style=\"display:flex;align-items:center;gap:10px;border-bottom:2px solid #17291d;padding:5px 10px;background:#eef2e6;cursor:grab;user-select:none;touch-action:none;\">\n          <span data-minbtn=\"1\" style=\"width:12px;height:12px;border:2px solid #17291d;background:#fdfcf8;cursor:pointer;flex:none;\"><\u002Fspan>\n          <span style=\"font-family:'Pixelify Sans',sans-serif;font-size:15px;font-weight:600;\">charter_goals.txt<\u002Fspan>\n        <\u002Fdiv>\n        <div data-body=\"1\" style=\"padding:18px 22px 20px;display:flex;flex-direction:column;gap:14px;\">\n          <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,220px),1fr));gap:10px;\">\n            <div style=\"border:2px solid #17291d;background:#eef2e6;padding:10px 12px;display:flex;gap:10px;align-items:baseline;\"><span style=\"font-weight:800;color:#a8221a;\">1<\u002Fspan><span style=\"font-size:15px;line-height:1.4;font-weight:600;\">Build the core system<\u002Fspan><\u002Fdiv>\n            <div style=\"border:2px solid #17291d;background:#eef2e6;padding:10px 12px;display:flex;gap:10px;align-items:baseline;\"><span style=\"font-weight:800;color:#a8221a;\">2<\u002Fspan><span style=\"font-size:15px;line-height:1.4;font-weight:600;\">Use it at least twice a week<\u002Fspan><\u002Fdiv>\n            <div style=\"border:2px solid #17291d;background:#eef2e6;padding:10px 12px;display:flex;gap:10px;align-items:baseline;\"><span style=\"font-weight:800;color:#a8221a;\">3<\u002Fspan><span style=\"font-size:15px;line-height:1.4;font-weight:600;\">Finish a progress view that shows the real status of the work<\u002Fspan><\u002Fdiv>\n          <\u002Fdiv>\n          <p style=\"margin:0;font-size:15.5px;line-height:1.62;max-width:820px;text-wrap:pretty;\">The charter set three measurable goals. Looking back, they overlap more than they should. The progress view is one of the core pieces, and the second goal measures use of the same system.<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <div data-win=\"1\" style=\"position:relative;background:#fdfcf8;border:2px solid #17291d;box-shadow:5px 5px 0 #17291d;min-width:0;\">\n        <div data-handle=\"1\" style=\"display:flex;align-items:center;gap:10px;border-bottom:2px solid #17291d;padding:5px 10px;background:#2e3e33;cursor:grab;user-select:none;touch-action:none;\">\n          <span data-minbtn=\"1\" style=\"width:12px;height:12px;border:2px solid #17291d;background:#fdfcf8;cursor:pointer;flex:none;\"><\u002Fspan>\n          <span style=\"font-family:'Pixelify Sans',sans-serif;font-size:15px;font-weight:600;color:#fdfcf8;\">ai_as_testbed.txt<\u002Fspan>\n        <\u002Fdiv>\n        <div data-body=\"1\" style=\"padding:18px 22px 20px;font-size:15.5px;line-height:1.62;\">\n          <p style=\"margin:0;max-width:820px;text-wrap:pretty;\">The capstone was also <mark style=\"background:linear-gradient(transparent 55%,#f3d687 55%);color:inherit;padding:0 1px;\">a safe place to test working with AI.<\u002Fmark> At this stage the system held no research data, only broad themes and institutional requirements.<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n\n    <sc-if value=\"{{ t2 }}\" hint-placeholder-val=\"{{ false }}\">\n      <div data-screen-label=\"03 Build\" style=\"display:flex;flex-direction:column;gap:4px;\">\n        <div style=\"font-family:'Pixelify Sans',sans-serif;font-size:15px;color:#a8221a;\"><span style=\"font-family:'Hanken Grotesk',sans-serif;font-weight:700;\">03<\u002Fspan> Build<\u002Fdiv>\n        <h2 style=\"margin:0;font-size:32px;font-weight:800;letter-spacing:-.02em;line-height:1.1;\">Answering the mindmap shortcomings in three decisions<\u002Fh2>\n      <\u002Fdiv>\n\n      <div data-win=\"1\" style=\"position:relative;background:#fdfcf8;border:2px solid #17291d;box-shadow:5px 5px 0 #17291d;min-width:0;\">\n        <div data-handle=\"1\" style=\"display:flex;align-items:center;gap:10px;border-bottom:2px solid #17291d;padding:5px 10px;background:#f2d27a;cursor:grab;user-select:none;touch-action:none;\">\n          <span data-minbtn=\"1\" style=\"width:12px;height:12px;border:2px solid #17291d;background:#fdfcf8;cursor:pointer;flex:none;\"><\u002Fspan>\n          <span style=\"font-family:'Pixelify Sans',sans-serif;font-size:15px;font-weight:600;\">architecture.map<\u002Fspan>\n          <span data-nodrag=\"1\" sc-camel-on-click=\"{{ clearDec }}\" style=\"margin-left:auto;cursor:pointer;white-space:nowrap;font-family:'Hanken Grotesk',sans-serif;font-weight:600;font-size:12px;padding:1px 7px;border:1.5px solid #17291d;background:{{ allChip.bg }};color:{{ allChip.fg }};\">Show all<\u002Fspan>\n        <\u002Fdiv>\n        <div data-body=\"1\" style=\"padding:18px 20px 20px;display:flex;flex-direction:column;gap:18px;\">\n          <div role=\"group\" aria-label=\"Design decisions\" style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,260px),1fr));gap:12px;\">\n            <sc-for list=\"{{ decisions }}\" as=\"d\" hint-placeholder-count=\"3\">\n              <button type=\"button\" sc-camel-on-click=\"{{ d.onClick }}\" aria-pressed=\"{{ d.pressed }}\" style=\"text-align:left;cursor:pointer;border:2px solid #17291d;padding:12px 14px;background:{{ d.bg }};box-shadow:{{ d.sh }};display:flex;flex-direction:column;gap:6px;transition:box-shadow .15s,background .15s;\">\n                <span style=\"display:flex;gap:8px;align-items:center;\"><span style=\"font-family:'Hanken Grotesk',sans-serif;font-weight:800;font-size:13px;width:22px;height:22px;flex:none;display:flex;align-items:center;justify-content:center;background:#17291d;color:#fdfcf8;\">{{ d.n }}<\u002Fspan><span style=\"font-family:'Pixelify Sans',sans-serif;font-size:12.5px;color:#a8221a;\">decision<\u002Fspan><\u002Fspan>\n                <span style=\"font-size:17px;font-weight:800;line-height:1.25;\">{{ d.title }}<\u002Fspan>\n                <span style=\"font-size:14px;line-height:1.55;\">{{ d.text }}<\u002Fspan>\n              <\u002Fbutton>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n\n          <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,280px),1fr));gap:14px;font-size:14px;line-height:1.35;\">\n            <div style=\"border:2px dashed #17291d;padding:12px;display:flex;flex-direction:column;gap:8px;background:{{ r1.bg }};opacity:{{ r1.o }};box-shadow:{{ r1.sh }};transition:opacity .2s,background .2s;\">\n              <div style=\"display:flex;gap:8px;align-items:center;font-family:'Pixelify Sans',sans-serif;font-size:12.5px;color:#a8221a;\"><span style=\"font-family:'Hanken Grotesk',sans-serif;font-weight:800;font-size:12px;width:20px;height:20px;display:flex;align-items:center;justify-content:center;background:#17291d;color:#fdfcf8;\">1<\u002Fspan>one place, one slice at a time<\u002Fdiv>\n              <div style=\"border:3px solid #17291d;padding:12px;background:#eef2e6;\"><div style=\"font-size:18px;font-weight:800;\">Work Database<\u002Fdiv><div style=\"font-weight:600;font-size:12.5px;margin-top:4px;\">86 work items · Task › Subtask › Step › Micro-step<\u002Fdiv><div style=\"font-size:12.5px;margin-top:4px;\">Pub1 · Pub2 · Thesis · Admin<\u002Fdiv><\u002Fdiv>\n              <div style=\"text-align:center;font-family:'Pixelify Sans',sans-serif;font-size:12px;color:#a8221a;\">↓ shown through<\u002Fdiv>\n              <div style=\"border:2px solid #17291d;padding:10px 12px;background:#fdfcf8;\"><b>Subpages<\u002Fb>, one per work package<\u002Fdiv>\n            <\u002Fdiv>\n            <div style=\"border:2px dashed #17291d;padding:12px;display:flex;flex-direction:column;gap:8px;background:{{ r2.bg }};opacity:{{ r2.o }};box-shadow:{{ r2.sh }};transition:opacity .2s,background .2s;\">\n              <div style=\"display:flex;gap:8px;align-items:center;font-family:'Pixelify Sans',sans-serif;font-size:12.5px;color:#a8221a;\"><span style=\"font-family:'Hanken Grotesk',sans-serif;font-weight:800;font-size:12px;width:20px;height:20px;display:flex;align-items:center;justify-content:center;background:#17291d;color:#fdfcf8;\">2<\u002Fspan>tagged on every item<\u002Fdiv>\n              <div style=\"border:2px solid #17291d;padding:10px 12px;background:#fdfcf8;display:flex;flex-direction:column;gap:8px;\"><b>Now, Next and Later layer<\u002Fb><div style=\"display:flex;gap:5px;flex-wrap:wrap;font-family:'Pixelify Sans',sans-serif;font-size:12px;\"><span style=\"background:#e03a2f;color:#fdfcf8;border:1.5px solid #17291d;padding:0 6px;\">Now<\u002Fspan><span style=\"background:#c9921a;border:1.5px solid #17291d;padding:0 6px;\">Next<\u002Fspan><span style=\"background:#eef2e6;border:1.5px solid #17291d;padding:0 6px;\">Later<\u002Fspan><\u002Fdiv><\u002Fdiv>\n              <div style=\"text-align:center;font-family:'Pixelify Sans',sans-serif;font-size:12px;color:#a8221a;\">↓ filtered into<\u002Fdiv>\n              <div style=\"border:2px solid #17291d;padding:10px 12px;background:#fdfcf8;\"><b>Board<\u002Fb> of current work by status<\u002Fdiv>\n            <\u002Fdiv>\n            <div style=\"border:2px dashed #17291d;padding:12px;display:flex;flex-direction:column;gap:8px;background:{{ r3.bg }};opacity:{{ r3.o }};box-shadow:{{ r3.sh }};transition:opacity .2s,background .2s;\">\n              <div style=\"display:flex;gap:8px;align-items:center;font-family:'Pixelify Sans',sans-serif;font-size:12.5px;color:#a8221a;\"><span style=\"font-family:'Hanken Grotesk',sans-serif;font-weight:800;font-size:12px;width:20px;height:20px;display:flex;align-items:center;justify-content:center;background:#17291d;color:#fdfcf8;\">3<\u002Fspan>quality layer<\u002Fdiv>\n              <div style=\"border:2px solid #17291d;padding:10px 12px;background:#fdfcf8;\"><b>Finish line<\u002Fb> on every work item<\u002Fdiv>\n              <div style=\"border:2px solid #17291d;padding:10px 12px;background:#fdfcf8;\"><b>Monthly goal<\u002Fb> with two yes or no checks<\u002Fdiv>\n              <div style=\"border:2px solid #17291d;padding:10px 12px;background:#fdfcf8;\"><b>Risks and Troubleshooting<\u002Fb> · 3 thesis risks<\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"border:2px solid #17291d;padding:10px 12px;background:#2e3e33;color:#fdfcf8;display:flex;flex-wrap:wrap;gap:6px 14px;align-items:baseline;font-size:14px;\"><b>Weekly and Monthly Review<\u002Fb><span style=\"font-family:'Pixelify Sans',sans-serif;font-size:12.5px;color:#f3d687;\">keeps all three current<\u002Fspan><\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <div data-win=\"1\" style=\"position:relative;background:#fdfcf8;border:2px solid #17291d;box-shadow:5px 5px 0 #17291d;min-width:0;\">\n        <div data-handle=\"1\" style=\"display:flex;align-items:center;gap:10px;border-bottom:2px solid #17291d;padding:5px 10px;background:#f2d27a;cursor:grab;user-select:none;touch-action:none;\">\n          <span data-minbtn=\"1\" style=\"width:12px;height:12px;border:2px solid #17291d;background:#fdfcf8;cursor:pointer;flex:none;\"><\u002Fspan>\n          <span style=\"font-family:'Pixelify Sans',sans-serif;font-size:15px;font-weight:600;\">now_next_later.board<\u002Fspan>\n          <span style=\"margin-left:auto;white-space:nowrap;font-family:'Pixelify Sans',sans-serif;font-size:12.5px;color:#4a5a4d;\">example cards<\u002Fspan>\n        <\u002Fdiv>\n        <div data-body=\"1\" style=\"padding:16px 18px 18px;display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,220px),1fr));gap:12px;\">\n          <sc-for list=\"{{ board }}\" as=\"col\" hint-placeholder-count=\"3\">\n            <div style=\"border:2px solid #17291d;background:#eef2e6;display:flex;flex-direction:column;\">\n              <div style=\"background:{{ col.bg }};color:{{ col.fg }};border-bottom:2px solid #17291d;padding:6px 12px;font-family:'Pixelify Sans',sans-serif;font-size:14px;display:flex;justify-content:space-between;gap:8px;\"><span>{{ col.name }}<\u002Fspan><span style=\"font-size:12px;\">{{ col.note }}<\u002Fspan><\u002Fdiv>\n              <div style=\"padding:10px;display:flex;flex-direction:column;gap:8px;\">\n                <sc-for list=\"{{ col.cards }}\" as=\"c\" hint-placeholder-count=\"2\">\n                  <div style=\"background:#fdfcf8;border:1.5px solid #17291d;padding:9px 10px;display:flex;flex-direction:column;gap:5px;\">\n                    <span style=\"align-self:flex-start;font-family:'Pixelify Sans',sans-serif;font-size:11.5px;background:#f2d27a;border:1.5px solid #17291d;padding:0 6px;\">{{ c.sec }}<\u002Fspan>\n                    <span style=\"font-weight:700;font-size:14.5px;line-height:1.3;\">{{ c.name }}<\u002Fspan>\n                    <span style=\"font-size:12.5px;color:#33463a;border-top:1px dashed #9fab98;padding-top:5px;\"><span style=\"font-family:'Pixelify Sans',sans-serif;color:#a8221a;\">done when:<\u002Fspan> {{ c.done }}<\u002Fspan>\n                  <\u002Fdiv>\n                <\u002Fsc-for>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n\n    <sc-if value=\"{{ t3 }}\" hint-placeholder-val=\"{{ false }}\">\n      <div data-screen-label=\"04 Process\" style=\"display:flex;flex-direction:column;gap:4px;\">\n        <div style=\"font-family:'Pixelify Sans',sans-serif;font-size:15px;color:#a8221a;\"><span style=\"font-family:'Hanken Grotesk',sans-serif;font-weight:700;\">04<\u002Fspan> Process<\u002Fdiv>\n        <h2 style=\"margin:0;font-size:32px;font-weight:800;letter-spacing:-.02em;line-height:1.1;\">Sprinting through three cycles<\u002Fh2>\n      <\u002Fdiv>\n\n      <div data-win=\"1\" style=\"position:relative;background:#fdfcf8;border:2px solid #17291d;box-shadow:5px 5px 0 #17291d;min-width:0;\">\n        <div data-handle=\"1\" style=\"display:flex;align-items:center;gap:10px;border-bottom:2px solid #17291d;padding:5px 10px;background:#f3d687;cursor:grab;user-select:none;touch-action:none;\">\n          <span data-minbtn=\"1\" style=\"width:12px;height:12px;border:2px solid #17291d;background:#fdfcf8;cursor:pointer;flex:none;\"><\u002Fspan>\n          <span style=\"font-family:'Pixelify Sans',sans-serif;font-size:15px;font-weight:600;color:#17291d;\">how_it_grew.log<\u002Fspan>\n        <\u002Fdiv>\n        <div data-body=\"1\" style=\"padding:22px 24px 24px;display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,340px),1fr));gap:22px 32px;align-items:center;\">\n          <div style=\"display:flex;flex-direction:column;gap:6px;min-width:0;\">\n            <div style=\"width:80%;background:#f3d687;color:#17291d;border:2px solid #17291d;padding:9px 12px;display:flex;flex-direction:column;gap:2px;\"><span style=\"display:flex;justify-content:space-between;gap:10px;font-weight:700;font-size:14.5px;\"><span>Iteration<\u002Fspan><span style=\"font-family:'Pixelify Sans',sans-serif;font-size:12px;font-weight:400;white-space:nowrap;\">Module 3 · Oct<\u002Fspan><\u002Fspan><span style=\"font-size:13px;line-height:1.4;\">feedback acted on, both risk registers filled, first monthly goal set, review rhythm automated<\u002Fspan><\u002Fdiv>\n            <div style=\"width:90%;background:#ce9d30;color:#17291d;border:2px solid #17291d;padding:9px 12px;display:flex;flex-direction:column;gap:2px;\"><span style=\"display:flex;justify-content:space-between;gap:10px;font-weight:700;font-size:14.5px;\"><span>Build<\u002Fspan><span style=\"font-family:'Pixelify Sans',sans-serif;font-size:12px;font-weight:400;white-space:nowrap;\">Module 2 · Sep<\u002Fspan><\u002Fspan><span style=\"font-size:13px;line-height:1.4;\">the database, the Now, Next and Later layer and the views on top of it<\u002Fspan><\u002Fdiv>\n            <div style=\"width:100%;background:#2e3e33;color:#fdfcf8;border:2px solid #17291d;padding:9px 12px;display:flex;flex-direction:column;gap:2px;\"><span style=\"display:flex;justify-content:space-between;gap:10px;font-weight:700;font-size:14.5px;\"><span>Scope and requirements<\u002Fspan><span style=\"font-family:'Pixelify Sans',sans-serif;font-size:12px;font-weight:400;white-space:nowrap;\">Module 1 · Aug<\u002Fspan><\u002Fspan><span style=\"font-size:13px;line-height:1.4;\">the charter, the institutional rules and the admin section<\u002Fspan><\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"display:flex;flex-direction:column;gap:14px;font-size:16px;line-height:1.6;min-width:0;\">\n            <p style=\"margin:0;text-wrap:pretty;\">I ran the three modules as <mark style=\"background:linear-gradient(transparent 55%,#f3d687 55%);color:inherit;padding:0 1px;\">three cycles rather than one long build.<\u002Fmark> Each cycle built on the one below it.<\u002Fp>\n            <p style=\"margin:0;text-wrap:pretty;\">I tested each element as I finished it, rather than everything at the end.<\u002Fp>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <div data-win=\"1\" style=\"position:relative;background:#fdfcf8;border:2px solid #17291d;box-shadow:5px 5px 0 #17291d;min-width:0;\">\n        <div data-handle=\"1\" style=\"display:flex;align-items:center;gap:10px;border-bottom:2px solid #17291d;padding:5px 10px;background:repeating-linear-gradient(0deg,#fdfcf8 0 2px,#e03a2f 2px 4px);cursor:grab;user-select:none;touch-action:none;\">\n          <span data-minbtn=\"1\" style=\"width:12px;height:12px;border:2px solid #17291d;background:#fdfcf8;cursor:pointer;flex:none;\"><\u002Fspan>\n          <span style=\"margin:0 auto;background:#fdfcf8;padding:0 10px;font-family:'Pixelify Sans',sans-serif;font-size:15px;font-weight:600;\">two_habits.txt<\u002Fspan>\n        <\u002Fdiv>\n        <div data-body=\"1\" style=\"padding:22px 22px 24px;display:flex;flex-direction:column;align-items:center;gap:20px;text-align:center;\">\n          <p style=\"margin:0;font-size:19px;font-weight:700;line-height:1.4;max-width:560px;text-wrap:balance;\">Two course habits changed how I worked rather than what I built.<\u002Fp>\n          <div style=\"width:100%;display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:18px;\">\n            <div style=\"border:2px solid #17291d;background:#fdfcf8;box-shadow:4px 4px 0 #e03a2f;padding:16px 18px 18px;display:flex;flex-direction:column;align-items:center;gap:12px;\">\n              <span style=\"font-family:'Pixelify Sans',sans-serif;font-size:13px;background:#e03a2f;color:#fdfcf8;border:1.5px solid #17291d;padding:1px 8px;\">habit <span style=\"font-family:'Hanken Grotesk',sans-serif;font-weight:700;\">1<\u002Fspan><\u002Fspan>\n              <div style=\"font-size:19px;font-weight:800;line-height:1.2;\">Feedback as planned work<\u002Fdiv>\n              <div style=\"display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:center;font-family:'Pixelify Sans',sans-serif;font-size:13px;\">\n                <span style=\"border:1.5px dashed #9fab98;color:#4a5a4d;padding:2px 8px;text-decoration:line-through;\">nice-to-haves<\u002Fspan>\n                <span style=\"color:#a8221a;\">→<\u002Fspan>\n                <span style=\"border:1.5px solid #17291d;background:#f2d27a;padding:2px 8px;\">work package<\u002Fspan>\n                <span style=\"color:#a8221a;\">+<\u002Fspan>\n                <span style=\"border:1.5px solid #17291d;background:#f2d27a;padding:2px 8px;\">milestone<\u002Fspan>\n              <\u002Fdiv>\n              <p style=\"margin:0;font-size:15px;line-height:1.6;max-width:420px;text-wrap:pretty;\">The instructor's review after Module 2 became a scoped work package in the capstone work breakdown, with its own milestone. It did not stay a list of nice-to-haves.<\u002Fp>\n            <\u002Fdiv>\n            <div style=\"border:2px solid #17291d;background:#fdfcf8;box-shadow:4px 4px 0 #c9921a;padding:16px 18px 18px;display:flex;flex-direction:column;align-items:center;gap:12px;\">\n              <span style=\"font-family:'Pixelify Sans',sans-serif;font-size:13px;background:#c9921a;color:#17291d;border:1.5px solid #17291d;padding:1px 8px;\">habit <span style=\"font-family:'Hanken Grotesk',sans-serif;font-weight:700;\">2<\u002Fspan><\u002Fspan>\n              <div style=\"font-size:19px;font-weight:800;line-height:1.2;\">Status reconciled against reality<\u002Fdiv>\n              <div style=\"display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:center;font-family:'Pixelify Sans',sans-serif;font-size:13px;\">\n                <span style=\"border:1.5px solid #9fab98;color:#4a5a4d;padding:2px 8px;\">Not started<\u002Fspan>\n                <span style=\"color:#a8221a;\">→<\u002Fspan>\n                <span style=\"border:1.5px solid #17291d;background:#2e3e33;color:#fdfcf8;padding:2px 8px;\">Done<\u002Fspan>\n                <span style=\"color:#4a5a4d;\">item by item<\u002Fspan>\n              <\u002Fdiv>\n              <p style=\"margin:0;font-size:15px;line-height:1.6;max-width:420px;text-wrap:pretty;\">By October several work items in the capstone work breakdown still said Not started although the work was done. I went through it item by item and brought the record back in line.<\u002Fp>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <div data-win=\"1\" style=\"position:relative;background:#fdfcf8;border:2px solid #17291d;box-shadow:5px 5px 0 #17291d;min-width:0;\">\n        <div data-handle=\"1\" style=\"display:flex;align-items:center;gap:10px;border-bottom:2px solid #17291d;padding:5px 10px;background:#f2d27a;cursor:grab;user-select:none;touch-action:none;\">\n          <span data-minbtn=\"1\" style=\"width:12px;height:12px;border:2px solid #17291d;background:#fdfcf8;cursor:pointer;flex:none;\"><\u002Fspan>\n          <span style=\"font-family:'Pixelify Sans',sans-serif;font-size:15px;font-weight:600;\">feedback → changes<\u002Fspan>\n        <\u002Fdiv>\n        <div data-body=\"1\" style=\"padding:18px 20px 22px;display:flex;flex-direction:column;gap:12px;\">\n          <div style=\"display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.6fr) minmax(0,.9fr);gap:0 10px;font-family:'Pixelify Sans',sans-serif;font-size:12.5px;color:#4a5a4d;\"><div>Feedback<\u002Fdiv><div>What I changed<\u002Fdiv><div>Where it lives<\u002Fdiv><\u002Fdiv>\n          <div style=\"display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.6fr) minmax(0,.9fr);gap:10px;align-items:stretch;\">\n            <div style=\"border:2px solid #17291d;padding:12px 14px;background:#e03a2f;color:#fdfcf8;font-weight:700;font-size:15px;line-height:1.35;\">State where AI was used<\u002Fdiv>\n            <div style=\"border:2px solid #17291d;padding:12px 14px;font-size:15px;line-height:1.5;\">I added an AI usage statement.<\u002Fdiv>\n            <div style=\"border:2px solid #17291d;padding:12px 14px;background:#f2d27a;font-family:'Pixelify Sans',sans-serif;font-size:13px;line-height:1.4;\">Bottom of the dashboard<\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.6fr) minmax(0,.9fr);gap:10px;align-items:stretch;\">\n            <div style=\"border:2px solid #17291d;padding:12px 14px;background:#e03a2f;color:#fdfcf8;font-weight:700;font-size:15px;line-height:1.35;\">User stories and a Definition of Done on tasks<\u002Fdiv>\n            <div style=\"border:2px solid #17291d;padding:12px 14px;font-size:15px;line-height:1.5;\">A finish line (Definition of Done) on every work item, shown on the board cards. A user story and a \"Done when\" checklist on each task. The weekly review checks finished items against their finish line.<\u002Fdiv>\n            <div style=\"border:2px solid #17291d;padding:12px 14px;background:#f2d27a;font-family:'Pixelify Sans',sans-serif;font-size:13px;line-height:1.4;\">Work Database, weekly review<\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.6fr) minmax(0,.9fr);gap:10px;align-items:stretch;\">\n            <div style=\"border:2px solid #17291d;padding:12px 14px;background:#e03a2f;color:#fdfcf8;font-weight:700;font-size:15px;line-height:1.35;\">Goals and metrics in OKR format<\u002Fdiv>\n            <div style=\"border:2px solid #17291d;padding:12px 14px;font-size:15px;line-height:1.5;\">One monthly goal (an Objective) with two yes or no checks (Key Results), set and scored at the monthly review.<\u002Fdiv>\n            <div style=\"border:2px solid #17291d;padding:12px 14px;background:#f2d27a;font-family:'Pixelify Sans',sans-serif;font-size:13px;line-height:1.4;\">Monthly review pages, dashboard gallery<\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.6fr) minmax(0,.9fr);gap:10px;align-items:stretch;\">\n            <div style=\"border:2px dashed #17291d;padding:12px 14px;font-weight:700;font-size:15px;line-height:1.35;\">Also: review automation (not from the feedback)<\u002Fdiv>\n            <div style=\"border:2px dashed #17291d;padding:12px 14px;font-size:15px;line-height:1.5;\">The weekly and monthly reviews became repeating templates shown on a calendar. Buttons create new pages from templates.<\u002Fdiv>\n            <div style=\"border:2px dashed #17291d;padding:12px 14px;background:#f2d27a;font-family:'Pixelify Sans',sans-serif;font-size:13px;line-height:1.4;\">Work Database, dashboard calendar<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <div data-win=\"1\" style=\"position:relative;background:#fdfcf8;border:2px solid #17291d;box-shadow:5px 5px 0 #17291d;min-width:0;\">\n        <div data-handle=\"1\" style=\"display:flex;align-items:center;gap:10px;border-bottom:2px solid #17291d;padding:5px 10px;background:repeating-linear-gradient(0deg,#fdfcf8 0 2px,#e03a2f 2px 4px);cursor:grab;user-select:none;touch-action:none;\">\n          <span data-minbtn=\"1\" style=\"width:12px;height:12px;border:2px solid #17291d;background:#fdfcf8;cursor:pointer;flex:none;\"><\u002Fspan>\n          <span style=\"margin:0 auto;background:#fdfcf8;padding:0 10px;font-family:'Pixelify Sans',sans-serif;font-size:15px;font-weight:600;\">ai_usage.txt<\u002Fspan>\n        <\u002Fdiv>\n        <div data-body=\"1\" style=\"padding:18px 22px 20px;display:flex;flex-direction:column;gap:14px;font-size:15.5px;line-height:1.62;\">\n          <p style=\"margin:0;max-width:820px;text-wrap:pretty;\">I used Claude as <mark style=\"background:linear-gradient(transparent 55%,#f3d687 55%);color:inherit;padding:0 1px;\">a sparring partner<\u002Fmark> to test different architectures and layouts. The decisions on structure and content stayed mine.<\u002Fp>\n          <p style=\"margin:0;max-width:820px;text-wrap:pretty;\">I kept a running record of the iterations and decisions as I went, so I could remember what did not work and why.<\u002Fp>\n          <div style=\"font-family:'Pixelify Sans',sans-serif;font-size:16px;line-height:1.5;background:#17291d;color:#fdfcf8;padding:14px 16px;\"><span style=\"color:#e03a2f;\">&gt;<\u002Fspan> Decisions about scope, what belongs in the risk register and whether a task is done stayed with me. AI helped me organise and move faster, but I decide what progress means. A statement to this effect sits at the bottom of the dashboard.<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n\n    <sc-if value=\"{{ t4 }}\" hint-placeholder-val=\"{{ false }}\">\n      <div data-screen-label=\"05 Results\" style=\"display:flex;flex-direction:column;gap:4px;\">\n        <div style=\"font-family:'Pixelify Sans',sans-serif;font-size:15px;color:#a8221a;\"><span style=\"font-family:'Hanken Grotesk',sans-serif;font-weight:700;\">05<\u002Fspan> Results<\u002Fdiv>\n        <h2 style=\"margin:0;font-size:32px;font-weight:800;letter-spacing:-.02em;line-height:1.1;\">What it holds &amp; what it does not prove<\u002Fh2>\n      <\u002Fdiv>\n\n      <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,200px),1fr));gap:16px;\">\n        <div style=\"background:#ce9d30;color:#17291d;border:2px solid #17291d;box-shadow:4px 4px 0 #17291d;padding:14px 16px;display:flex;flex-direction:column;gap:6px;\">\n          <div style=\"font-size:40px;font-weight:800;line-height:1;letter-spacing:-.02em;\">{{ c86 }}<\u002Fdiv>\n          <div style=\"font-size:13px;line-height:1.35;font-weight:500;\">work items ({{ c52 }} done)<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"background:#fdfcf8;color:#17291d;border:2px solid #17291d;box-shadow:4px 4px 0 #17291d;padding:14px 16px;display:flex;flex-direction:column;gap:6px;\">\n          <div style=\"font-size:40px;font-weight:800;line-height:1;letter-spacing:-.02em;\">4<\u002Fdiv>\n          <div style=\"font-size:13px;line-height:1.35;font-weight:500;\">levels, from task to micro-step<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"background:#2e3e33;color:#fdfcf8;border:2px solid #17291d;box-shadow:4px 4px 0 #17291d;padding:14px 16px;display:flex;flex-direction:column;gap:6px;\">\n          <div style=\"font-size:40px;font-weight:800;line-height:1;letter-spacing:-.02em;color:#f3d687;\">4 of 4<\u002Fdiv>\n          <div style=\"font-size:13px;line-height:1.35;font-weight:500;\">core pieces delivered<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"background:#f3d687;color:#17291d;border:2px solid #17291d;box-shadow:4px 4px 0 #17291d;padding:14px 16px;display:flex;flex-direction:column;gap:6px;\">\n          <div style=\"font-size:40px;font-weight:800;line-height:1;letter-spacing:-.02em;\">1<\u002Fdiv>\n          <div style=\"font-size:13px;line-height:1.35;font-weight:500;\">real user, the main limit<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,340px),1fr));gap:22px;align-items:start;\">\n        <div data-win=\"1\" style=\"position:relative;background:#fdfcf8;border:2px solid #17291d;box-shadow:5px 5px 0 #17291d;min-width:0;\">\n          <div data-handle=\"1\" style=\"display:flex;align-items:center;gap:10px;border-bottom:2px solid #17291d;padding:5px 10px;background:#ce9d30;cursor:grab;user-select:none;touch-action:none;\">\n            <span data-minbtn=\"1\" style=\"width:12px;height:12px;border:2px solid #17291d;background:#fdfcf8;cursor:pointer;flex:none;\"><\u002Fspan>\n            <span style=\"font-family:'Pixelify Sans',sans-serif;font-size:15px;font-weight:600;color:#17291d;\">where_it_stands.txt<\u002Fspan>\n          <\u002Fdiv>\n          <div data-body=\"1\" style=\"padding:18px 22px 22px;font-size:15.5px;line-height:1.62;display:flex;flex-direction:column;gap:12px;\">\n            <p style=\"margin:0;text-wrap:pretty;\">The dashboard holds 86 work items on four levels and Risks and Troubleshooting for the thesis. <mark style=\"background:linear-gradient(transparent 55%,#f3d687 55%);color:inherit;padding:0 1px;\">I use it to run the rest of my thesis.<\u002Fmark><\u002Fp>\n            <p style=\"margin:0;text-wrap:pretty;\">I delivered the four core pieces within the course time. I also built a fictional demo version of the dashboard to share. The stretch goal stayed Not started by decision, so neither time-related capstone risk materialised.<\u002Fp>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div data-win=\"1\" style=\"position:relative;background:#fdfcf8;border:2px solid #17291d;box-shadow:5px 5px 0 #17291d;min-width:0;\">\n          <div data-handle=\"1\" style=\"display:flex;align-items:center;gap:10px;border-bottom:2px solid #17291d;padding:5px 10px;background:#f3d687;cursor:grab;user-select:none;touch-action:none;\">\n            <span data-minbtn=\"1\" style=\"width:12px;height:12px;border:2px solid #17291d;background:#fdfcf8;cursor:pointer;flex:none;\"><\u002Fspan>\n            <span style=\"font-family:'Pixelify Sans',sans-serif;font-size:15px;font-weight:600;color:#17291d;\">deliverables<\u002Fspan>\n          <\u002Fdiv>\n          <div data-body=\"1\" style=\"padding:14px 18px;display:flex;flex-direction:column;gap:8px;font-family:'Pixelify Sans',sans-serif;font-size:16px;\">\n            <div>[x] <span style=\"font-family:'Hanken Grotesk',sans-serif;font-weight:700;\">1.0<\u002Fspan> Requirements and scope definition<\u002Fdiv>\n            <div>[x] <span style=\"font-family:'Hanken Grotesk',sans-serif;font-weight:700;\">2.0<\u002Fspan> Dashboard architecture and setup<\u002Fdiv>\n            <div>[x] <span style=\"font-family:'Hanken Grotesk',sans-serif;font-weight:700;\">3.0<\u002Fspan> Populated and piloted dashboard<\u002Fdiv>\n            <div style=\"color:#a8221a;\">[~] <span style=\"font-family:'Hanken Grotesk',sans-serif;font-weight:700;\">4.0<\u002Fspan> Final report and presentation<\u002Fdiv>\n            <div style=\"color:#4a5a4d;\">[ ] <span style=\"font-family:'Hanken Grotesk',sans-serif;font-weight:700;\">5.0<\u002Fspan> Stretch goal, not started by decision<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <p style=\"margin:0;font-size:15.5px;line-height:1.62;max-width:820px;text-wrap:pretty;\">I keep two risk registers for two different projects. Only the first is part of phd.OS. I review both at the monthly review.<\u002Fp>\n      <div data-win=\"1\" style=\"position:relative;background:#fdfcf8;border:2px solid #17291d;box-shadow:5px 5px 0 #17291d;min-width:0;\">\n        <div data-handle=\"1\" style=\"display:flex;align-items:center;gap:10px;border-bottom:2px solid #17291d;padding:5px 10px;background:#f2d27a;cursor:grab;user-select:none;touch-action:none;\">\n          <span data-minbtn=\"1\" style=\"width:12px;height:12px;border:2px solid #17291d;background:#fdfcf8;cursor:pointer;flex:none;\"><\u002Fspan>\n          <span style=\"font-family:'Pixelify Sans',sans-serif;font-size:15px;font-weight:600;color:#17291d;\">risks_and_troubleshooting.db<\u002Fspan>\n          <span style=\"margin-left:auto;white-space:nowrap;flex:none;font-family:'Hanken Grotesk',sans-serif;font-weight:600;font-size:13px;color:#17291d;\">{{ regT.count }}<\u002Fspan>\n        <\u002Fdiv>\n        <div data-body=\"1\" style=\"padding:16px 18px 18px;display:flex;flex-direction:column;gap:14px;\">\n          <p style=\"margin:0;font-size:15.5px;line-height:1.6;max-width:820px;text-wrap:pretty;\"><strong>Risks and Troubleshooting<\u002Fstrong> lives in the dashboard and holds three risks to finishing the thesis.<\u002Fp>\n          <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:18px 24px;align-items:start;\">\n            <div style=\"min-width:0;\">\n              <div style=\"display:grid;grid-template-columns:22px repeat(3,minmax(0,1fr));grid-template-rows:repeat(3,70px) 22px;gap:4px;\">\n                <sc-for list=\"{{ regT.matrix }}\" as=\"cell\" hint-placeholder-count=\"16\">\n                  <div style=\"background:{{ cell.bg }};border:{{ cell.bd }};display:flex;flex-wrap:wrap;gap:5px;align-items:center;justify-content:center;font-family:'Pixelify Sans',sans-serif;font-size:11.5px;color:#4a5a4d;writing-mode:{{ cell.wm }};transform:{{ cell.tf }};\">{{ cell.label }}<sc-for list=\"{{ cell.dots }}\" as=\"d\" hint-placeholder-count=\"0\"><span sc-camel-on-click=\"{{ d.onClick }}\" title=\"{{ d.title }}\" style=\"cursor:pointer;width:28px;height:28px;border-radius:50%;font-family:'Hanken Grotesk',sans-serif;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;background:{{ d.bg }};color:{{ d.fg }};border:{{ d.bd }};opacity:{{ d.o }};box-shadow:{{ d.sh }};transition:opacity .2s;\">{{ d.n }}<\u002Fspan><\u002Fsc-for><\u002Fdiv>\n                <\u002Fsc-for>\n              <\u002Fdiv>\n              <div style=\"font-family:'Pixelify Sans',sans-serif;font-size:11.5px;color:#4a5a4d;margin:6px 0 0 26px;\">Impact ↑ · Likelihood →<\u002Fdiv>\n            <\u002Fdiv>\n            <div style=\"min-width:0;\">\n              <div style=\"display:flex;flex-wrap:wrap;gap:5px;margin-bottom:10px;\">\n                <sc-for list=\"{{ regT.chips }}\" as=\"c\" hint-placeholder-count=\"4\"><span sc-camel-on-click=\"{{ c.onClick }}\" style=\"cursor:pointer;white-space:nowrap;font-family:'Hanken Grotesk',sans-serif;font-weight:600;font-size:12px;padding:1px 7px;border:1.5px solid #17291d;background:{{ c.bg }};color:{{ c.fg }};\">{{ c.label }}<\u002Fspan><\u002Fsc-for>\n              <\u002Fdiv>\n              <sc-for list=\"{{ regT.rows }}\" as=\"r\" hint-placeholder-count=\"3\">\n                <div sc-camel-on-click=\"{{ r.onClick }}\" style=\"cursor:pointer;display:grid;grid-template-columns:26px minmax(0,1fr) auto;gap:10px;align-items:start;padding:8px 6px;border-top:1px solid #d5dccb;background:{{ r.rowBg }};\">\n                  <span style=\"font-family:'Hanken Grotesk',sans-serif;font-weight:700;font-size:12.5px;width:22px;height:22px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:{{ r.bg }};color:{{ r.fg }};border:{{ r.bd }};\">{{ r.n }}<\u002Fspan>\n                  <div style=\"font-size:14.5px;line-height:1.4;\"><div style=\"font-weight:600;\">{{ r.risk }}<\u002Fdiv><div style=\"font-size:12.5px;color:#4a5a4d;margin-top:2px;\">{{ r.meta }}<\u002Fdiv><\u002Fdiv>\n                  <span style=\"font-family:'Pixelify Sans',sans-serif;font-size:11.5px;padding:1px 7px;white-space:nowrap;background:{{ r.bg }};color:{{ r.fg }};border:{{ r.bd }};\">{{ r.status }}<\u002Fspan>\n                <\u002Fdiv>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div data-win=\"1\" style=\"position:relative;background:#fdfcf8;border:2px solid #17291d;box-shadow:5px 5px 0 #17291d;min-width:0;\">\n        <div data-handle=\"1\" style=\"display:flex;align-items:center;gap:10px;border-bottom:2px solid #17291d;padding:5px 10px;background:#2e3e33;cursor:grab;user-select:none;touch-action:none;\">\n          <span data-minbtn=\"1\" style=\"width:12px;height:12px;border:2px solid #17291d;background:#fdfcf8;cursor:pointer;flex:none;\"><\u002Fspan>\n          <span style=\"font-family:'Pixelify Sans',sans-serif;font-size:15px;font-weight:600;color:#fdfcf8;\">capstone_register.db<\u002Fspan>\n          <span style=\"margin-left:auto;white-space:nowrap;flex:none;font-family:'Hanken Grotesk',sans-serif;font-weight:600;font-size:13px;color:#fdfcf8;\">{{ regC.count }}<\u002Fspan>\n        <\u002Fdiv>\n        <div data-body=\"1\" style=\"padding:16px 18px 18px;display:flex;flex-direction:column;gap:14px;\">\n          <p style=\"margin:0;font-size:15.5px;line-height:1.6;max-width:820px;text-wrap:pretty;\"><strong>Capstone risk register<\u002Fstrong> lives on the Capstone Project page and holds six risks to the capstone project itself. It is not part of phd.OS.<\u002Fp>\n          <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:18px 24px;align-items:start;\">\n            <div style=\"min-width:0;\">\n              <div style=\"display:grid;grid-template-columns:22px repeat(3,minmax(0,1fr));grid-template-rows:repeat(3,70px) 22px;gap:4px;\">\n                <sc-for list=\"{{ regC.matrix }}\" as=\"cell\" hint-placeholder-count=\"16\">\n                  <div style=\"background:{{ cell.bg }};border:{{ cell.bd }};display:flex;flex-wrap:wrap;gap:5px;align-items:center;justify-content:center;font-family:'Pixelify Sans',sans-serif;font-size:11.5px;color:#4a5a4d;writing-mode:{{ cell.wm }};transform:{{ cell.tf }};\">{{ cell.label }}<sc-for list=\"{{ cell.dots }}\" as=\"d\" hint-placeholder-count=\"0\"><span sc-camel-on-click=\"{{ d.onClick }}\" title=\"{{ d.title }}\" style=\"cursor:pointer;width:28px;height:28px;border-radius:50%;font-family:'Hanken Grotesk',sans-serif;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;background:{{ d.bg }};color:{{ d.fg }};border:{{ d.bd }};opacity:{{ d.o }};box-shadow:{{ d.sh }};transition:opacity .2s;\">{{ d.n }}<\u002Fspan><\u002Fsc-for><\u002Fdiv>\n                <\u002Fsc-for>\n              <\u002Fdiv>\n              <div style=\"font-family:'Pixelify Sans',sans-serif;font-size:11.5px;color:#4a5a4d;margin:6px 0 0 26px;\">Impact ↑ · Likelihood →<\u002Fdiv>\n            <\u002Fdiv>\n            <div style=\"min-width:0;\">\n              <div style=\"display:flex;flex-wrap:wrap;gap:5px;margin-bottom:10px;\">\n                <sc-for list=\"{{ regC.chips }}\" as=\"c\" hint-placeholder-count=\"4\"><span sc-camel-on-click=\"{{ c.onClick }}\" style=\"cursor:pointer;white-space:nowrap;font-family:'Hanken Grotesk',sans-serif;font-weight:600;font-size:12px;padding:1px 7px;border:1.5px solid #17291d;background:{{ c.bg }};color:{{ c.fg }};\">{{ c.label }}<\u002Fspan><\u002Fsc-for>\n              <\u002Fdiv>\n              <sc-for list=\"{{ regC.rows }}\" as=\"r\" hint-placeholder-count=\"3\">\n                <div sc-camel-on-click=\"{{ r.onClick }}\" style=\
