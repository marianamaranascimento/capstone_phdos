"cursor:pointer;display:grid;grid-template-columns:26px minmax(0,1fr) auto;gap:10px;align-items:start;padding:8px 6px;border-top:1px solid #d5dccb;background:{{ r.rowBg }};\">\n                  <span style=\"font-family:'Hanken Grotesk',sans-serif;font-weight:700;font-size:12.5px;width:22px;height:22px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:{{ r.bg }};color:{{ r.fg }};border:{{ r.bd }};\">{{ r.n }}<\u002Fspan>\n                  <div style=\"font-size:14.5px;line-height:1.4;\"><div style=\"font-weight:600;\">{{ r.risk }}<\u002Fdiv><div style=\"font-size:12.5px;color:#4a5a4d;margin-top:2px;\">{{ r.meta }}<\u002Fdiv><\u002Fdiv>\n                  <span style=\"font-family:'Pixelify Sans',sans-serif;font-size:11.5px;padding:1px 7px;white-space:nowrap;background:{{ r.bg }};color:{{ r.fg }};border:{{ r.bd }};\">{{ r.status }}<\u002Fspan>\n                <\u002Fdiv>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"display:flex;gap:14px;flex-wrap:wrap;font-family:'Pixelify Sans',sans-serif;font-size:12px;\">\n        <span style=\"display:flex;align-items:center;gap:5px;\"><span style=\"width:11px;height:11px;border-radius:50%;background:#e03a2f;border:1.5px solid #17291d;\"><\u002Fspan>Open<\u002Fspan>\n        <span style=\"display:flex;align-items:center;gap:5px;\"><span style=\"width:11px;height:11px;border-radius:50%;background:#c9921a;border:1.5px solid #17291d;\"><\u002Fspan>Mitigated<\u002Fspan>\n        <span style=\"display:flex;align-items:center;gap:5px;\"><span style=\"width:11px;height:11px;border-radius:50%;background:#fdfcf8;border:1.5px solid #9fab98;\"><\u002Fspan>Closed<\u002Fspan>\n      <\u002Fdiv>\n\n      <div data-win=\"1\" style=\"position:relative;background:#fdfcf8;border:2px solid #17291d;box-shadow:5px 5px 0 #17291d;min-width:0;\">\n        <div data-handle=\"1\" style=\"display:flex;align-items:center;gap:10px;border-bottom:2px solid #17291d;padding:5px 10px;background:#2e3e33;cursor:grab;user-select:none;touch-action:none;\">\n          <span data-minbtn=\"1\" style=\"width:12px;height:12px;border:2px solid #17291d;background:#fdfcf8;cursor:pointer;flex:none;\"><\u002Fspan>\n          <span style=\"font-family:'Pixelify Sans',sans-serif;font-size:15px;font-weight:600;color:#fdfcf8;\">known_limits.txt<\u002Fspan>\n        <\u002Fdiv>\n        <div data-body=\"1\" style=\"padding:18px 22px 22px;display:flex;flex-direction:column;gap:14px;\">\n          <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,260px),1fr));gap:10px;\">\n            <div style=\"border:2px solid #17291d;padding:12px 14px;background:#eef2e6;\"><div style=\"font-family:'Pixelify Sans',sans-serif;font-size:13px;color:#a8221a;\">limit <span style=\"font-family:'Hanken Grotesk',sans-serif;font-weight:700;\">1<\u002Fspan><\u002Fdiv><div style=\"font-weight:800;font-size:16px;line-height:1.25;margin-top:4px;\">One real user<\u002Fdiv><div style=\"font-size:14px;line-height:1.5;margin-top:6px;color:#33463a;\">I was the only real user, so nothing shows it works for another PhD student.<\u002Fdiv><\u002Fdiv>\n            <div style=\"border:2px solid #17291d;padding:12px 14px;background:#eef2e6;\"><div style=\"font-family:'Pixelify Sans',sans-serif;font-size:13px;color:#a8221a;\">limit <span style=\"font-family:'Hanken Grotesk',sans-serif;font-weight:700;\">2<\u002Fspan><\u002Fdiv><div style=\"font-weight:800;font-size:16px;line-height:1.25;margin-top:4px;\">End-stage momentum<\u002Fdiv><div style=\"font-size:14px;line-height:1.5;margin-top:6px;color:#33463a;\">Finishing a PhD creates its own momentum. I cannot separate it from the effect of managing the work.<\u002Fdiv><\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"font-family:'Pixelify Sans',sans-serif;font-size:17px;line-height:1.45;background:#2e3e33;color:#fdfcf8;padding:14px 16px;\"><span style=\"color:#f3d687;\">&gt;<\u002Fspan> My evidence shows that I used the system, not that it caused my progress.<\u002Fdiv>\n          <p style=\"margin:0;font-size:14px;color:#4a5a4d;line-height:1.55;\">The thesis work breakdown, the capstone charter and both risk registers stay in Notion.<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n\n    <sc-if value=\"{{ t5 }}\" hint-placeholder-val=\"{{ false }}\">\n      <div data-screen-label=\"06 Next\" style=\"display:flex;flex-direction:column;gap:4px;\">\n        <div style=\"font-family:'Pixelify Sans',sans-serif;font-size:15px;color:#a8221a;\"><span style=\"font-family:'Hanken Grotesk',sans-serif;font-weight:700;\">06<\u002Fspan> Next<\u002Fdiv>\n        <h2 style=\"margin:0;font-size:32px;font-weight:800;letter-spacing:-.02em;line-height:1.1;\">What to keep &amp; what to change<\u002Fh2>\n      <\u002Fdiv>\n      <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,340px),1fr));gap:22px;align-items:stretch;\">\n        <div data-win=\"1\" style=\"position:relative;background:#fdfcf8;border:2px solid #17291d;box-shadow:5px 5px 0 #17291d;min-width:0;\">\n          <div data-handle=\"1\" style=\"display:flex;align-items:center;gap:10px;border-bottom:2px solid #17291d;padding:5px 10px;background:#c9921a;cursor:grab;user-select:none;touch-action:none;\">\n            <span data-minbtn=\"1\" style=\"width:12px;height:12px;border:2px solid #17291d;background:#fdfcf8;cursor:pointer;flex:none;\"><\u002Fspan>\n            <span style=\"font-family:'Pixelify Sans',sans-serif;font-size:15px;font-weight:600;\">keep.txt<\u002Fspan>\n          <\u002Fdiv>\n          <div data-body=\"1\" style=\"padding:18px 22px 20px;font-size:15.5px;line-height:1.62;display:flex;flex-direction:column;gap:12px;\">\n            <p style=\"margin:0;text-wrap:pretty;\">The choice I would keep first is <mark style=\"background:linear-gradient(transparent 55%,#f3d687 55%);color:inherit;padding:0 1px;\">the monthly focus.<\u002Fmark> Seeing everything at once made my mindmap unusable. Choosing each month what comes next made this system feel like a helpful guide instead.<\u002Fp>\n            <p style=\"margin:0;text-wrap:pretty;\">Testing each view at its simplest let me spot problems as the user and trace them as the builder, before I got invested in complicating the system.<\u002Fp>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div data-win=\"1\" style=\"position:relative;background:#fdfcf8;border:2px solid #17291d;box-shadow:5px 5px 0 #17291d;min-width:0;\">\n          <div data-handle=\"1\" style=\"display:flex;align-items:center;gap:10px;border-bottom:2px solid #17291d;padding:5px 10px;background:#e03a2f;cursor:grab;user-select:none;touch-action:none;\">\n            <span data-minbtn=\"1\" style=\"width:12px;height:12px;border:2px solid #17291d;background:#fdfcf8;cursor:pointer;flex:none;\"><\u002Fspan>\n            <span style=\"font-family:'Pixelify Sans',sans-serif;font-size:15px;font-weight:600;color:#fdfcf8;\">change.txt<\u002Fspan>\n          <\u002Fdiv>\n          <div data-body=\"1\" style=\"padding:18px 22px 20px;font-size:15.5px;line-height:1.62;display:flex;flex-direction:column;gap:12px;\">\n            <p style=\"margin:0;text-wrap:pretty;\">I would <mark style=\"background:linear-gradient(transparent 55%,#f3d687 55%);color:inherit;padding:0 1px;\">set the guardrails first.<\u002Fmark> The risk register and the finish lines came after the first round of feedback. They would have guided my first decisions.<\u002Fp>\n            <p style=\"margin:0;text-wrap:pretty;\">I would also run the weekly reviews from the beginning.<\u002Fp>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div data-win=\"1\" style=\"position:relative;background:#fdfcf8;border:2px solid #17291d;box-shadow:5px 5px 0 #17291d;min-width:0;\">\n        <div data-handle=\"1\" style=\"display:flex;align-items:center;gap:10px;border-bottom:2px solid #17291d;padding:5px 10px;background:repeating-linear-gradient(0deg,#fdfcf8 0 2px,#e03a2f 2px 4px);cursor:grab;user-select:none;touch-action:none;\">\n          <span data-minbtn=\"1\" style=\"width:12px;height:12px;border:2px solid #17291d;background:#fdfcf8;cursor:pointer;flex:none;\"><\u002Fspan>\n          <span style=\"margin:0 auto;background:#fdfcf8;padding:0 10px;font-family:'Pixelify Sans',sans-serif;font-size:15px;font-weight:600;\">the_real_test.txt<\u002Fspan>\n        <\u002Fdiv>\n        <div data-body=\"1\" style=\"padding:18px 22px 20px;font-size:15.5px;line-height:1.62;display:flex;flex-direction:column;gap:12px;\">\n          <p style=\"margin:0;max-width:820px;text-wrap:pretty;\">A blank version tried by another PhD student would be <mark style=\"background:linear-gradient(transparent 55%,#f3d687 55%);color:inherit;padding:0 1px;\">the first real test<\u002Fmark> of whether the system works beyond me.<\u002Fp>\n          <p style=\"margin:0;max-width:820px;text-wrap:pretty;\">Until then, the demo shows the structure in use, with illustrative research and dates.<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <a href=\"https://separate-gladiolus-36f.notion.site/phd-OS-a-management-dashboard-e5e6fccf7b15832eb8c001117d16bb20\" target=\"_blank\" rel=\"noopener\" style=\"display:block;text-decoration:none;color:#fdfcf8;background:#e03a2f;border:2px solid #17291d;box-shadow:6px 6px 0 #17291d;transition:transform .15s,box-shadow .15s;\" style-hover=\"transform:translate(-3px,-3px);box-shadow:9px 9px 0 #17291d;color:#fdfcf8;\">\n        <div style=\"display:flex;align-items:center;gap:10px;border-bottom:2px solid #17291d;padding:5px 10px;background:repeating-linear-gradient(0deg,#fdfcf8 0 2px,#17291d 2px 4px);\">\n          <span style=\"width:12px;height:12px;border:2px solid #17291d;background:#fdfcf8;flex:none;\"><\u002Fspan>\n          <span style=\"margin:0 auto;background:#fdfcf8;color:#17291d;padding:0 10px;font-family:'Pixelify Sans',sans-serif;font-size:15px;font-weight:600;\">demo.link<\u002Fspan>\n        <\u002Fdiv>\n        <div style=\"padding:26px 28px 28px;display:flex;flex-wrap:wrap;gap:12px 24px;align-items:center;justify-content:space-between;\">\n          <div style=\"display:flex;flex-direction:column;gap:6px;\">\n            <span style=\"font-family:'Pixelify Sans',sans-serif;font-size:15px;\">fictional demo · Notion<\u002Fspan>\n            <span style=\"font-size:34px;font-weight:800;line-height:1.05;letter-spacing:-.02em;\">Open the phd.OS demo<\u002Fspan>\n          <\u002Fdiv>\n          <span style=\"font-family:'Pixelify Sans',sans-serif;font-size:30px;background:#fdfcf8;color:#17291d;border:2px solid #17291d;padding:2px 16px;\">↗<\u002Fspan>\n        <\u002Fdiv>\n      <\u002Fa>\n    <\u002Fsc-if>\n\n    <div style=\"display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:6px;padding-top:14px;border-top:2px solid #17291d;font-family:'Pixelify Sans',sans-serif;font-size:15px;\">\n      <span sc-camel-on-click=\"{{ prev }}\" style=\"cursor:pointer;background:#fdfcf8;border:2px solid #17291d;box-shadow:3px 3px 0 #17291d;padding:4px 12px;\" style-hover=\"background:#f2d27a;\">◀ <span style=\"font-family:'Hanken Grotesk',sans-serif;font-weight:700;\">{{ pv.num }}<\u002Fspan> {{ pv.name }}<\u002Fspan>\n      <span style=\"color:#4a5a4d;margin:0 auto;\">phd.OS · PM course capstone project · built and maintained in Notion · by <a href=\"https://www.linkedin.com/in/mmnasc/\" target=\"_blank\" rel=\"noopener\">Mariana Nascimento<\u002Fa><\u002Fspan>\n      <span sc-camel-on-click=\"{{ next }}\" style=\"cursor:pointer;background:#fdfcf8;border:2px solid #17291d;box-shadow:3px 3px 0 #17291d;padding:4px 12px;\" style-hover=\"background:#f2d27a;\"><span style=\"font-family:'Hanken Grotesk',sans-serif;font-weight:700;\">{{ nx.num }}<\u002Fspan> {{ nx.name }} ▶<\u002Fspan>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;draggableWindows&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;},&quot;rememberTab&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;}}\">\nconst TABS = ['01 Problem', '02 Scope', '03 Build', '04 Process', '05 Results', '06 Next'];\nconst INK = '#17291d', PAPER = '#fdfcf8', TOM = '#e03a2f', MUS = '#c9921a', TINT = '#f2d27a', MUTED = '#9fab98';\nconst LV = { Low: 0, Medium: 1, High: 2 };\nconst RISKS = [\n  ['Thesis', 'Feedback on drafts arrives late', 'Feedback', 'Medium', 'High', 'open', 'Open'],\n  ['Thesis', 'Approvals and signatures take longer than planned', 'Admin & Requirements', 'Medium', 'Medium', 'open', 'Open'],\n  ['Thesis', 'Experiments or analyses fail or need repeating', 'Experimental/Technical', 'High', 'Medium', 'closed', 'Closed (experiments finished)'],\n  ['Capstone', 'Capstone work competes with thesis work for time', 'Time constraint', 'High', 'High', 'closed', 'Closed'],\n  ['Capstone', 'Scope creep into stretch goals or Notion polish', 'Time constraint', 'Medium', 'Medium', 'closed', 'Closed'],\n  ['Capstone', 'Dashboard stops being updated at a high-fatigue stage', 'Adoption', 'Medium', 'High', 'open', 'Open'],\n  ['Capstone', 'Tool only tested on one person, so it may not generalise', 'Evidence validity', 'High', 'Low', 'mit', 'Mitigated'],\n  ['Capstone', 'Hard to tell if the dashboard helped or it was ordinary end-stage momentum', 'Evidence validity', 'Medium', 'Low', 'open', 'Open'],\n  ['Capstone', 'Recall bias from the retrospective case study', 'Evidence validity', 'Low', 'Low', 'closed', 'Closed (study dropped from scope)'],\n].map((r, i) => ({ id: i + 1, reg: r[0], risk: r[1], cat: r[2], L: r[3], I: r[4], st: r[5], status: r[6] }));\nconst ST = {\n  open: { bg: TOM, fg: PAPER, bd: '1.5px solid ' + INK },\n  mit: { bg: MUS, fg: INK, bd: '1.5px solid ' + INK },\n  closed: { bg: PAPER, fg: '#4a5a4d', bd: '1.5px solid ' + MUTED },\n};\nconst SEV = ['#f3f5ec', '#eaeedf', '#f7ebc4', '#f2d27a', '#f1a99f'];\nconst DECISIONS = [\n  { title: 'Show me only what I can act on now', text: 'All the work sits in one database: 86 work items on four levels, across two publications, the thesis and admin. I work from subpages that each show one slice. The full scope is there when I need it, but it is not the first thing I see.' },\n  { title: 'Plan for timelines that move', text: 'I tag every item Now, Next or Later and decide once a month what moves. The monthly review works like sprint planning, a short meeting that sets the next block of work. Tasks have no due dates, because they would be guesses. The only dates belong to the reviews.' },\n  { title: 'Say what \"done\" means and name the risks', text: 'Every work item has a finish line that states when it counts as done, so nothing is closed on a feeling. Each month has one goal with two yes or no checks. Risks and Troubleshooting rates each thesis risk and records a planned response.' },\n];\nconst NOW_ITEMS = [\n  { sec: 'Paper 1', name: 'Prepare the sequencing dataset' },\n  { sec: 'Paper 1', name: 'Set up the analysis pipeline' },\n  { sec: 'Thesis', name: 'Revise chapter 3 after feedback' },\n  { sec: 'Admin', name: 'File the annual progress report' },\n];\nconst BOARD = [\n  { name: 'Now', note: 'this month', bg: TOM, fg: PAPER, cards: [\n    { sec: 'Paper 1', name: 'Prepare the sequencing dataset', done: 'the dataset passes quality checks' },\n    { sec: 'Thesis', name: 'Revise chapter 3', done: 'the revision is sent for feedback' } ] },\n  { name: 'Next', note: 'after that', bg: MUS, fg: INK, cards: [\n    { sec: 'Paper 1', name: 'Run the analysis', done: 'results are ready for figures' },\n    { sec: 'Paper 1', name: 'Draft the figures', done: 'all panels are drafted' } ] },\n  { name: 'Later', note: 'buffer', bg: '#eef2e6', fg: INK, cards: [\n    { sec: 'Thesis', name: 'Introduction', done: 'a first draft is complete' },\n    { sec: 'Admin', name: 'Submission paperwork', done: 'the forms are filed' } ] },\n];\n\nclass Component extends DCLogic {\n  state = { p: 1, tab: 0, dec: null, st_Thesis: 'all', st_Capstone: 'all', risk: null };\n\n  componentDidMount() {\n    if (this.props.rememberTab !== false) {\n      try { const t = parseInt(localStorage.getItem('phdos-v6-tab'), 10); if (t >= 0 && t < TABS.length) this.setState({ tab: t }); } catch (e) {}\n    }\n    this._key = e => {\n      const tg = e.target && e.target.tagName;\n      if (tg === 'INPUT' || tg === 'TEXTAREA' || (e.target && e.target.isContentEditable)) return;\n      if (e.key === 'ArrowRight') this.go(1);\n      if (e.key === 'ArrowLeft') this.go(-1);\n    };\n    let drag = null, z = 10;\n    this._down = e => {\n      const mb = e.target.closest && e.target.closest('[data-minbtn]');\n      if (mb) {\n        const w = mb.closest('[data-win]'), b = w && w.querySelector('[data-body]');\n        if (b) { const hid = b.style.display === 'none'; b.style.display = hid ? '' : 'none'; mb.style.background = hid ? PAPER : TOM; }\n        return;\n      }\n      if (this.props.draggableWindows === false) return;\n      const h = e.target.closest && e.target.closest('[data-handle]');\n      if (!h || e.target.closest('[data-nodrag]')) return;\n      const w = h.closest('[data-win]'); if (!w) return;\n      const [x, y] = (w.dataset.pos || '0,0').split(',').map(Number);\n      drag = { w, h, sx: e.clientX - x, sy: e.clientY - y };\n      w.style.zIndex = ++z; h.style.cursor = 'grabbing';\n      e.preventDefault();\n    };\n    this._move = e => {\n      if (!drag) return;\n      const x = e.clientX - drag.sx, y = e.clientY - drag.sy;\n      drag.w.style.transform = `translate(${x}px,${y}px)`;\n      drag.w.dataset.pos = `${x},${y}`;\n    };\n    this._up = () => { if (drag) { drag.h.style.cursor = 'grab'; drag = null; } };\n    window.addEventListener('keydown', this._key);\n    document.addEventListener('pointerdown', this._down);\n    document.addEventListener('pointermove', this._move);\n    document.addEventListener('pointerup', this._up);\n  }\n  componentWillUnmount() {\n    cancelAnimationFrame(this._raf);\n    window.removeEventListener('keydown', this._key);\n    document.removeEventListener('pointerdown', this._down);\n    document.removeEventListener('pointermove', this._move);\n    document.removeEventListener('pointerup', this._up);\n  }\n  countUp() {\n    cancelAnimationFrame(this._raf);\n    const t0 = performance.now(), D = 900;\n    const step = now => { const k = Math.min(1, (now - t0) / D); this.setState({ p: 1 - Math.pow(1 - k, 3) }); if (k < 1) this._raf = requestAnimationFrame(step); };\n    this._raf = requestAnimationFrame(step);\n  }\n  setTab(t) {\n    this.setState({ tab: t });\n    if (t === 4) this.countUp();\n    try { localStorage.setItem('phdos-v6-tab', String(t)); } catch (e) {}\n    try { window.scrollTo(0, 0); } catch (e) {}\n  }\n  go(d) { this.setTab((this.state.tab + d + TABS.length) % TABS.length); }\n  tidy() {\n    document.querySelectorAll('[data-win]').forEach(w => { w.style.transform = ''; w.dataset.pos = '0,0'; w.style.zIndex = ''; });\n    document.querySelectorAll('[data-body]').forEach(b => { b.style.display = ''; });\n    document.querySelectorAll('[data-minbtn]').forEach(b => { b.style.background = PAPER; });\n  }\n  chip(on, label, onClick) { return { label, onClick, bg: on ? INK : 'transparent', fg: on ? PAPER : INK }; }\n\n  renderVals() {\n    const s = this.state, tab = s.tab;\n    const vals = {};\n    TABS.forEach((_, i) => { vals['t' + i] = tab === i; });\n    const tabs = TABS.map((label, i) => ({ num: label.slice(0, 2), name: label.slice(3), onClick: () => this.setTab(i), bg: tab === i ? INK : PAPER, fg: tab === i ? PAPER : INK }));\n\n    const decisions = DECISIONS.map((d, i) => {\n      const n = i + 1, on = s.dec === n;\n      return { n, title: d.title, text: d.text, pressed: on, onClick: () => this.setState({ dec: on ? null : n }), bg: on ? TINT : PAPER, sh: on ? '4px 4px 0 ' + TOM : '3px 3px 0 ' + INK };\n    });\n    const region = n => {\n      const on = s.dec === n, dim = s.dec !== null && !on;\n      return { bg: on ? '#f7ebc4' : 'transparent', o: dim ? 0.3 : 1, sh: on ? '5px 5px 0 ' + TOM : 'none' };\n    };\n\n    const buildReg = reg => {\n      const list = RISKS.filter(r => r.reg === reg).map((r, i) => ({ ...r, n: i + 1 }));\n      const sk = 'st_' + reg, st = s[sk];\n      const vis = r => st === 'all' || r.st === st;\n      const pick = r => () => this.setState({ risk: s.risk === r.id ? null : r.id });\n      const blank = label => ({ label, bg: 'transparent', bd: 'none', wm: 'horizontal-tb', tf: 'none', dots: [] });\n      const matrix = [];\n      ['High', 'Medium', 'Low'].forEach(imp => {\n        matrix.push({ ...blank(imp), wm: 'vertical-rl', tf: 'rotate(180deg)' });\n        ['Low', 'Medium', 'High'].forEach(lik => {\n          const ds = list.filter(r => r.I === imp && r.L === lik).map(r => {\n            const c = ST[r.st];\n            return { n: r.n, title: r.risk, onClick: pick(r), bg: c.bg, fg: c.fg, bd: c.bd, o: vis(r) ? 1 : 0.18, sh: s.risk === r.id ? '0 0 0 3px ' + INK : 'none' };\n          });\n          matrix.push({ ...blank(''), bg: SEV[LV[lik] + LV[imp]], bd: '1px solid #d5dccb', dots: ds });\n        });\n      });\n      matrix.push(blank(''));\n      ['Low', 'Medium', 'High'].forEach(l => matrix.push(blank(l)));\n      const rows = list.filter(vis).map(r => {\n        const c = ST[r.st];\n        return { n: r.n, risk: r.risk, meta: `${r.cat} · ${r.L} likelihood / ${r.I} impact`, status: r.status, onClick: pick(r), bg: c.bg, fg: c.fg, bd: c.bd, rowBg: s.risk === r.id ? TINT : 'transparent' };\n      });\n      const chips = [['all', 'Any status'], ['open', 'Open'], ['mit', 'Mitigated'], ['closed', 'Closed']]\n        .filter(([v]) => v === 'all' || list.some(r => r.st === v))\n        .map(([v, l]) => this.chip(st === v, l, () => this.setState({ [sk]: v })));\n      return { matrix, rows, chips, count: `${rows.length} of ${list.length}` };\n    };\n\n    const L = TABS.length;\n    const sp = i => { const t = TABS[(i + L) % L]; return { num: t.slice(0, 2), name: t.slice(3) }; };\n    return {\n      ...vals, tabs,\n      prev: () => this.go(-1), next: () => this.go(1), tidy: () => this.tidy(), goBuild: () => this.setTab(2),\n      cur: sp(tab), pv: sp(tab - 1), nx: sp(tab + 1), pos: `${tab + 1} / ${L}`,\n      nowItems: NOW_ITEMS, board: BOARD,\n      decisions, r1: region(1), r2: region(2), r3: region(3),\n      clearDec: () => this.setState({ dec: null }), allChip: this.chip(s.dec === null, 'Show all', null),\n      c86: Math.round(86 * s.p), c52: Math.round(52 * s.p),\n      regT: buildReg('Thesis'), regC: buildReg('Capstone'),\n    };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
